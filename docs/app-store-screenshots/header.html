<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Expeat — App Store başlık görseli</title>
<!--
  App Store ürün sayfası başlığı (Product page header, 3840×1646). 1920×823 çizilir, 2 kat ölçekle alınır:
  bash render-header.sh → out/header-tr.png, out/header-en.png. ?lang=en İngilizce.
  Kurallar (Apple): tek net fikir, önemli öğeler ortada (kenarlar cihaza göre kırpılır), alt kısma uygulama
  ikonu/adı binebilir; URL, fiyat, © yok; içerik 4+.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500;14..32,600;14..32,700&family=Newsreader:ital,opsz,wght@0,6..72,600;1,6..72,500&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:1920px;height:823px;overflow:hidden;background:#0F1E3D}
body{font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;position:relative;
  background:radial-gradient(ellipse 60% 75% at 50% 38%,#2A4378 0%,rgba(34,56,106,.55) 38%,rgba(15,30,61,0) 72%),
             linear-gradient(180deg,#14264D 0%,#0F1E3D 100%)}
.copy{position:absolute;left:0;right:0;top:232px;text-align:center;color:#fff}
.h{font-family:Newsreader,serif;font-weight:600;font-size:100px;line-height:1;letter-spacing:-1.8px;margin:0;white-space:nowrap;display:inline-block}
.h em{font-style:italic;font-weight:500;color:#9FD474}
.sub{margin-top:22px;font-size:27px;font-weight:500;color:rgba(255,255,255,.72);letter-spacing:-.2px}
.post{position:absolute;width:310px;border-radius:28px;overflow:hidden;background:#fff;transform:rotate(var(--r));
  box-shadow:0 30px 64px rgba(4,10,26,.55),0 0 0 1px rgba(255,255,255,.08)}
.pimg{height:236px}.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pbody{padding:16px 18px 18px}
.prow{display:flex;align-items:center;gap:12px}
.pav{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:none}
.pmeta{flex:1;min-width:0}
.pname{font-weight:700;font-size:19px;color:#0F1E3D;letter-spacing:-.2px}
.pplace{font-weight:500;font-size:15px;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pscore{width:52px;height:52px;border-radius:50%;border:3.5px solid;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:19px;letter-spacing:-.3px;font-variant-numeric:tabular-nums;flex:none}
.pcap{margin-top:12px;font-size:17px;line-height:1.35;color:#111827}
</style>
</head>
<body>
<div id="art"></div>
<div class="copy">
  <h1 class="h" id="h"></h1>
  <div class="sub" id="sub"></div>
</div>
<script>
const EN=new URLSearchParams(location.search).get('lang')==='en';
document.documentElement.lang=EN?'en':'tr';
// İngilizcede markanın sözü, Türkçede aynı fikir Türkçe başlıkla (kullanıcı kararı); uzun başlık kartlara çarpmasın
// diye genişliğe sığana dek küçülür
const h=document.getElementById('h');
h.innerHTML=EN?'Eat the <em>experience</em>':'Deneyimini <em>arkadaşlarınla</em> paylaş';
document.getElementById('sub').textContent=EN?'Rate the places you go and share the experience with friends.':'Gittiğin yerleri puanla, en iyilerini birlikte keşfet.';
document.fonts.ready.then(()=>{let px=100;while(h.scrollWidth>1080&&px>60){px-=2;h.style.fontSize=px+'px'}});

// Puan renkleri: uygulamadaki scoreColor ile aynı skala
const BANDS=[{min:6.7,max:10,from:'#65B32E',to:'#1E7B3C'},{min:3.4,max:6.6,from:'#F2A516',to:'#F5C518'},{min:0,max:3.3,from:'#B42318',to:'#EF4B3C'}];
const h2r=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mix=(a,b,t)=>'#'+h2r(a).map((c,i)=>Math.round(c+(h2r(b)[i]-c)*t).toString(16).padStart(2,'0')).join('');
const color=s=>{const b=BANDS.find(b=>s>=b.min)??BANDS[2];return mix(b.from,b.to,Math.min(1,Math.max(0,(s-b.min)/(b.max-b.min))))};
const ink=s=>mix(color(s),'#000000',s>=3.4&&s<6.7?.38:.2);
const fmt=s=>EN?s.toFixed(1):s.toFixed(1).replace('.',',');
const ph=id=>`https://images.unsplash.com/photo-${id}?w=700&q=82&auto=format&fit=crop`;
const av=n=>`https://i.pravatar.cc/200?img=${n}`;

// Kenarlarda gönderi kartları (fotoğraf, paylaşan, mekân, kısa yorum, puan): deneyim paylaşımı. Kırpılsa da olur;
// orta alan yazıya ayrılır
const posts=[
  ['1555939594-58d7cb561ad1',12,'Kaan','Zübeyir Ocakbaşı',9.4,'Adana ve kaburga efsane.','The Adana kebab is legendary.',  60,  80,'-6deg'],
  ['1533089860892-a7c6f0a88666',47,'Selin','Van Kahvaltı Evi',9.1,'Pazar sabahı, erken gidin.','Sunday morning, go early.',  330, 420,'5deg'],
  ['1488477181946-6428a0291777',32,'Ece','Baylan Pastanesi',8.7,'Kup griye bayıldık.','We loved the kup griye.',  1540,  60,'6deg'],
  ['1519708227418-c8fd9a32b7a2',15,'Burak','Arnavutköy Balıkçısı',8.9,'Boğaz manzarası bedava.','The Bosphorus view is free.',  1280, 410,'-5deg'],
];
const art=document.getElementById('art');
for(const [id,a,name,place,s,tr,en,x,y,r] of posts){
  art.insertAdjacentHTML('beforeend',`<div class="post" style="left:${x}px;top:${y}px;--r:${r}">
    <div class="pimg"><img src="${ph(id)}"></div>
    <div class="pbody">
      <div class="prow"><img class="pav" src="${av(a)}"><div class="pmeta"><div class="pname">${name}</div><div class="pplace">${place}</div></div>
        <div class="pscore" style="border-color:${color(s)};color:${ink(s)}">${fmt(s)}</div></div>
      <div class="pcap">${EN?en:tr}</div>
    </div></div>`);
}
</script>
</body>
</html>
