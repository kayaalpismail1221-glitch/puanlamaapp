<!doctype html>
<!-- Paylaşım önizleme görseli (1200×630): icons.py değil, shots.sh sonunda Edge ile çizilir → web/img/og-tr.png, og-en.png -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&family=Newsreader:ital,opsz,wght@0,6..72,500..700;1,6..72,500&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;color:#fff;font-family:Inter,sans-serif;background:
  radial-gradient(55% 70% at 80% 10%,rgba(86,112,174,.55),transparent 70%),
  radial-gradient(40% 50% at 0% 100%,rgba(101,179,46,.18),transparent 70%),
  linear-gradient(160deg,#1B2F5E,#0F1E3D 50%,#0A1530)}
.copy{position:absolute;left:84px;top:96px;width:600px}
.wm{font:700 46px/1 Newsreader,serif;letter-spacing:-1px}
h1{font:600 64px/1.03 Newsreader,serif;letter-spacing:-1.6px;margin:54px 0 0}
h1 em{font-style:italic;font-weight:500}
p{font:italic 500 28px/1 Newsreader,serif;opacity:.7;margin:34px 0 0}
img{position:absolute;filter:drop-shadow(0 30px 40px rgba(0,0,0,.5))}
.a{height:700px;left:720px;top:70px}
.b{height:560px;left:930px;top:150px;transform:rotate(7deg);opacity:.95}
</style></head>
<body>
<div class="copy"><div class="wm">Expeat</div><h1 id="h"></h1><p>Eat the experience.</p></div>
<img class="b" src="../../web/img/ekran-5.webp"><img class="a" src="../../web/img/ekran-1.webp">
<script>
const en=new URLSearchParams(location.search).get('lang')==='en';
document.getElementById('h').innerHTML=en?'Rate the places you go, <em>discover with friends</em>':'Gittiğin yerleri puanla, <em>arkadaşlarınla</em> keşfet';
</script>
</body></html>
